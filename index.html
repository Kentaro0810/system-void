<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608"><title>SYSTEM//VOID</title>
<style>
:root{--bg:#050608;--fg:#d9f7ea;--dim:#7a9b90;--red:#ff334f;--green:#4dffc3;--panel:#0b1012;--line:#18352e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022),rgba(255,255,255,.022) 1px,transparent 1px,transparent 4px);z-index:9}
#app{min-height:100svh;display:grid;place-items:center;padding:24px}.panel{width:min(860px,100%);background:linear-gradient(180deg,rgba(12,18,20,.97),rgba(4,7,8,.98));border:1px solid var(--line);box-shadow:0 0 80px rgba(32,255,178,.08);padding:clamp(22px,4vw,44px);position:relative;overflow:hidden}.panel:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(67,255,193,.045),transparent 55%);pointer-events:none}
h1{letter-spacing:.18em;font-size:clamp(2rem,7vw,4rem);margin:.2em 0}.tag{color:var(--green);letter-spacing:.2em}.warning{border-left:3px solid var(--red);padding:14px 16px;background:#28070d;color:#ffdbe1;line-height:1.7}.small{color:#9bb2aa;font-size:.9rem;line-height:1.7}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:inherit;min-height:48px;padding:12px 18px;border:1px solid var(--green);background:#07130f;color:var(--green);cursor:pointer}button:hover,button:focus{background:#0c2a20;outline:2px solid #fff;outline-offset:2px}.danger{border-color:var(--red);color:#ffd3da;background:#21060b}.ghost{border-color:#53625d;color:#cbd7d3;background:#090d0e}
#exit{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:30;display:none;background:#111;border-color:#aaa;color:#fff;font-size:.8rem}.screen{width:min(970px,100%);min-height:78svh;border:1px solid #21473d;background:#020504;padding:20px;box-shadow:inset 0 0 80px #001a12,0 0 80px rgba(0,255,170,.08);position:relative}.top{display:flex;justify-content:space-between;gap:10px;color:#749c8e;border-bottom:1px solid #163a30;padding-bottom:12px}.log{white-space:pre-wrap;line-height:1.6;color:#a7f5d8;font-size:clamp(.78rem,2vw,1rem);min-height:48svh}.cursor{display:inline-block;width:.65em;height:1em;background:var(--green);animation:blink .75s steps(1) infinite;vertical-align:-.15em}.meter{height:12px;border:1px solid #285c4d;margin:20px 0}.fill{height:100%;width:0;background:var(--green);box-shadow:0 0 16px var(--green);transition:width .35s}.status{color:#89aa9e}.glitch{animation:glitch .12s 8}.red{color:var(--red)!important;text-shadow:0 0 12px #f03}.question{border:1px solid #39433f;padding:22px;margin-top:18px;background:#080b0b}.choice{width:100%;text-align:left;margin-top:10px}.hidden{display:none!important}.reveal{text-align:center}.reveal h2{font-size:clamp(2rem,7vw,4rem);color:#fff}.ok{border:1px solid #22634f;background:#071912;padding:18px;line-height:1.7}@keyframes blink{50%{opacity:0}}@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(4px,-1px);filter:hue-rotate(80deg)}50%{transform:translate(-5px,2px)}75%{transform:translate(3px,1px)}100%{transform:translate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<button id="exit" type="button">緊急終了</button><main id="app" aria-live="polite"></main>
<script>
(()=>{const app=document.querySelector('#app'),exit=document.querySelector('#exit');let timers=[],aborted=false,audio=null;
const later=(fn,ms)=>{const id=setTimeout(()=>!aborted&&fn(),ms);timers.push(id)};const clear=()=>{aborted=true;timers.forEach(clearTimeout);timers=[];if(audio)audio.close().catch(()=>{})};
function home(){clear();aborted=false;exit.style.display='none';app.innerHTML=`<section class="panel"><div class="tag">INTERACTIVE HORROR EXPERIENCE</div><h1>SYSTEM//VOID</h1><p class="small">約3分のブラウザ向け短編ホラーです。架空のシステム画面、ノイズ、突然の暗転、低い音を含みます。</p><div class="warning"><strong>安全について</strong><br>これはホラー演出です。端末、ファイル、アカウントには一切アクセスせず、情報の送信や保存もしません。いつでも「緊急終了」で停止できます。</div><p class="small">光の点滅が苦手な場合は、端末の「視差効果を減らす」設定を利用し、音なしで体験してください。</p><div class="row"><button id="start" type="button">音ありで開始</button><button id="silent" class="ghost" type="button">音なしで開始</button></div></section>`;document.querySelector('#start').onclick=()=>start(true);document.querySelector('#silent').onclick=()=>start(false)}
function tone(freq=55,dur=.18,vol=.035){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function start(sound){clear();aborted=false;if(sound){audio=new (window.AudioContext||window.webkitAudioContext)()}exit.style.display='block';app.innerHTML=`<section class="screen"><div class="top"><span>VOID RECOVERY CONSOLE</span><span id="clock">00:00:00</span></div><div id="log" class="log"></div><div class="meter"><div id="fill" class="fill"></div></div><div id="status" class="status">INITIALIZING<span class="cursor"></span></div><div id="q" class="question hidden"></div></section>`;
const log=document.querySelector('#log'),fill=document.querySelector('#fill'),status=document.querySelector('#status'),clock=document.querySelector('#clock'),q=document.querySelector('#q');let p=0,i=0;const lines=['[00] memory boundary ........ OK','[01] local archive .......... SEALED','[02] network uplink ......... DISABLED','[03] observer process ....... NOT FOUND','[04] restoring abandoned session','[05] checking terminal ownership','[06] discrepancy detected','[07] session timestamp precedes initialization','[08] unresolved input found in empty buffer','[09] do not close the console'];
const tick=()=>{p=Math.min(93,p+[3,7,2,9,1][i%5]);fill.style.width=p+'%';clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false});if(i<lines.length){log.textContent+=lines[i]+'\n';tone(45+i*3,.12);i++;later(tick,520+i*40)}else phase2()};tick();
function phase2(){status.textContent='WAITING FOR RESPONSE';q.classList.remove('hidden');q.innerHTML=`<strong>端末の前に、誰かいますか。</strong><button class="choice" data-v="yes" type="button">はい</button><button class="choice" data-v="no" type="button">いいえ</button>`;q.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.v))}
function answer(v){q.classList.add('hidden');log.classList.add('glitch','red');tone(28,.8,.08);log.textContent+='\n> '+(v==='yes'?'応答を受信しました。':'応答は受信されませんでした。')+'\n';later(()=>{log.classList.remove('glitch');log.textContent+='\n[10] contradiction logged\n[11] the empty terminal answered\n[12] operator count: 2\n';status.innerHTML='<span class="red">SECOND OPERATOR DETECTED</span>';fill.style.width='100%';later(finale,2500)},900)}
function finale(){app.querySelector('.screen').classList.add('glitch');tone(24,1.2,.1);later(()=>{app.innerHTML=`<section class="panel reveal"><div class="tag">SESSION RELEASED</div><h2>あなたではない。</h2><p class="small">もう一つの応答は、最初から記録の中にありました。</p><div class="ok"><strong>体験終了</strong><br>これは安全なホラー演出です。端末情報の取得、ファイル操作、通信、保存は一切行っていません。</div><div class="row" style="justify-content:center"><button id="again" type="button">もう一度</button><button id="end" class="ghost" type="button">終了</button></div></section>`;exit.style.display='none';document.querySelector('#again').onclick=home;document.querySelector('#end').onclick=home},900)} }
exit.onclick=()=>{clear();exit.style.display='none';app.innerHTML=`<section class="panel reveal"><h2>終了しました</h2><div class="ok">すべての演出を停止しました。端末への変更はありません。</div><div class="row" style="justify-content:center"><button id="back" type="button">開始画面へ戻る</button></div></section>`;document.querySelector('#back').onclick=home};home()})();
</script></body></html>
